<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background-image: url(https://assets.nflxext.com/ffe/siteui/vlv3/26b49bdf-9cd6-4414-aef6-c4e30cab8f78/web/BR-pt-20261123-TRIFECTA-perspective_3afdb186-9cfc-4f84-ad7d-cd8bbb6f3dee_large.jpg);
      background-size: cover;
      background-position: top center;
    }

    #heading {
      background-color: rgba(0, 0, 0, 0.8);
      /* background-color: rgb(229, 9, 20); */
    }

    #heading div {
      width: 92%;
      display: flex;
      /* background: blue; */
      justify-content: space-between;
      margin: 0 auto;
    }

    #heading .h1 {
      padding: 20px 0;
      /* padding: 20px 10px 0 50px; */
      font-size: 30px;
      text-transform: uppercase;
    }

    #heading a {
      /* color: #fff; */
      color: red;
      text-decoration: none;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <header id="heading">
    <div>
      <h1 class="h1">
        <a href="#">Netflix</a>
      </h1>
      <h2 class="h1">
        <a href="#">Netflix</a>
      </h2>
    </div>
  </header>
</body>
</html>
