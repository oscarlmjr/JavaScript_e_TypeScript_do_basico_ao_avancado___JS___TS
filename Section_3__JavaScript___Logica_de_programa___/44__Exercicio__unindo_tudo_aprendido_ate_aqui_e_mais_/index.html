<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 44</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <section class="container">
    <h2>Tabela IMC</h2>
    <article class="texto-duas-colunas">
      <div class="coluna">
        <p>
          <h4>IMC</h4>
          Menos do que 18,5<br>
          Entre 18,5 e 24,9<br>
          Entre 25 e 29,9<br>
          Entre 30 e 34,9<br>
          Entre 35 e 39,9<br>
          Mais do que 40   
        </p>
      </div>
      <div class="coluna">
        <p>
          <h4>Resultado</h4>
          Abaixo do peso<br>
          Peso normal<br>
          Sobrepeso<br>
          Obesidade grau 1<br>
          Obesidade grau 2<br>
          Obesidade grau 3
        </p>
      </div>
    </article>

    <p><h3>Calcule seu IMC</h3></p>
    <form class="form" action="" method="get">
      <p>Peso:<input type="float" class="peso"></p>
      <p>Altura:<input type="float" class="altura"></p>

      <button>Calcular</button>
    </form>
    <div class="calculo"></div>
    <div class="invalido"></div>
  </section>

  <script src="assets/js/main.js"></script>
</body>
</html>
